[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "latency-arbitrage-bot"
version = "0.1.0"
description = "Latency arbitrage bot for prediction markets - exploits speed differential between data sources and prediction market platforms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Async HTTP & WebSocket
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "httpx>=0.27.0",

    # Prediction Market SDKs
    "py-clob-client>=0.15.0",

    # Web3 / Blockchain (Polymarket on Polygon)
    "web3>=6.15.0",
    "eth-account>=0.11.0",

    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "orjson>=3.9.0",

    # Configuration & Environment
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Scheduling & Tasks
    "apscheduler>=3.10.0",

    # Logging & Monitoring
    "structlog>=24.1.0",
    "rich>=13.7.0",

    # Database (for trade history & analytics)
    "aiosqlite>=0.19.0",

    # Rate Limiting
    "aiolimiter>=1.1.0",

    # CLI
    "click>=8.1.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
arb-bot = "src.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
